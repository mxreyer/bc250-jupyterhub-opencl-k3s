# GitHub Pages configuration.
#
# Source: main branch, repository root (Settings -> Pages -> Build and
# deployment -> Deploy from a branch -> main / (root)).
# Published at https://mxreyer.github.io/bc250-jupyterhub-opencl-k3s/
#
# README.md becomes the landing page (Pages uses it when there is no
# index file); SETUP.md is served next to it as .html. The project
# write-up and the benchmark moved to their own repositories
# (mxreyer/blog, mxreyer/pytorch-gpu-bc250). GitHub Pages enables the
# jekyll-relative-links plugin by default, so a link written as
# [SETUP.md](SETUP.md) resolves to SETUP.html on the site while
# still working as a file link on github.com. Keep internal links in that
# form, and refer to anything under an excluded path as plain code rather
# than a link - it would 404 on the site.

title: BC-250 ML box
description: >-
  JupyterHub with GPU-accelerated PyTorch on an AsRock BC-250, served
  from a single-node k3s cluster.

theme: jekyll-theme-cayman

# The published site is the prose only. Code and manifests stay in the
# repository and are not copied into the site build.
exclude:
  - k8s/
  - Gemfile
  - Gemfile.lock
  - vendor/
